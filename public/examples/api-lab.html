<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>첫 API 실습 · Shaula</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1.25rem;line-height:1.7;color:#25234b;background:#f4f1ff}h1{line-height:1.3}button{font:inherit;padding:.7rem 1rem;margin:0 .5rem .7rem 0;background:#6354c0;color:white;border:0;border-radius:.7rem;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:1.2rem;background:white;border:1px solid #d5cff0;border-radius:1rem}a{color:#4c3eb0}button:focus-visible,a:focus-visible{outline:3px solid #285dc1;outline-offset:3px}</style></head><body><h1>버튼으로 자료 요청하기</h1><p>요청 주소 → 서버의 응답 → 화면 표시를 직접 확인해 보세요. 이 예제는 같은 사이트의 정적 JSON을 요청하며, 외부 AI API를 호출하지 않습니다.</p><button id="success">자료 요청</button><button id="failure">없는 주소 요청</button><pre id="output" role="status" aria-live="polite">아직 요청하지 않았어요.</pre><p><a href="/worksheets/api-worksheet.html">활동지 보기</a> · <a href="/education#worksheets">교육 페이지로</a></p><script>const output=document.querySelector('#output');const buttons=[...document.querySelectorAll('button')];async function request(path){buttons.forEach(b=>b.disabled=true);output.textContent='응답을 기다리고 있어요…';try{const response=await fetch(path,{signal:AbortSignal.timeout(5000)});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(typeof data.message!=='string')throw new Error('응답 형식 오류');output.textContent='성공: '+data.message+'\n요청 주소: '+path;}catch(error){output.textContent='요청 실패: '+(error instanceof Error?error.message:'연결 오류')+'\n오류를 확인한 뒤 다시 요청해 보세요.';}finally{buttons.forEach(b=>b.disabled=false)}}document.querySelector('#success').onclick=()=>request('/examples/lesson-menu.json');document.querySelector('#failure').onclick=()=>request('/examples/missing-lesson.json');</script></body></html>
