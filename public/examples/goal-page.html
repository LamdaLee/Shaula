<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나의 목표 — 교육용 작동 예시</title><style>body{font-family:system-ui,sans-serif;background:#f4f1ff;color:#25234b;max-width:36rem;margin:3rem auto;padding:1rem;line-height:1.7}form{display:flex;flex-wrap:wrap;gap:.75rem}input{flex:1;min-width:10rem;padding:.8rem;border:1px solid #6d5ce7;border-radius:.5rem;font:inherit}button{background:#6d5ce7;color:white;padding:.8rem;border:0;border-radius:.5rem;font:inherit}li{padding:.5rem}a{color:#4933b3}:focus-visible{outline:3px solid #285dc1;outline-offset:3px}</style></head><body><p>Shaula · 교육용 예시</p><h1>나의 목표</h1><p>입력과 버튼의 연결을 시험해 보세요. 기록은 저장하거나 외부로 전송하지 않습니다.</p><form><label for="goal">목표</label><input id="goal" placeholder="예: AI 요약을 원문과 비교하기"><button>추가</button></form><p id="message" role="status"></p><ul id="goals"></ul><p>시험: 빈 입력 · 정상 입력 · 연속 입력</p><a href="/education">교육 페이지로 돌아가기</a><noscript>이 예시를 실행하려면 JavaScript를 켜주세요.</noscript><script>const form=document.querySelector('form'),input=document.querySelector('#goal'),message=document.querySelector('#message');form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){message.textContent='목표를 입력해 주세요.';input.focus();return}const li=document.createElement('li');li.textContent=text;document.querySelector('#goals').append(li);input.value='';message.textContent='목표를 추가했습니다.';input.focus()});</script></body></html>
